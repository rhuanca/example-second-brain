<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Second Brain{% endblock %}</title>
<style>
  /* Chrome and the categorical palette are the dataviz reference instance:
     slots --c1..--c8 in this exact order (it is what keeps neighbours distinct
     under colour-vision deficiency), --c0 the neutral "Other". --iN is the label
     ink that clears contrast on each fill. Dark values are stepped for the dark
     surface, not flipped. */
  :root {
    color-scheme: light dark;
    --page: #f9f9f7; --surface: #fcfcfb; --raised: #ffffff;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #6f6d67;
    --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11, 11, 11, 0.10);
    --c0: #c3c2b7; --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
    --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948;
    --i0: #0b0b0b; --i1: #0b0b0b; --i2: #0b0b0b; --i3: #0b0b0b; --i4: #0b0b0b;
    --i5: #0b0b0b; --i6: #ffffff; --i7: #ffffff; --i8: #0b0b0b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d; --surface: #1a1a19; --raised: #201f1e;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #9c9a93;
      --grid: #2c2c2a; --axis: #383835; --ring: rgba(255, 255, 255, 0.10);
      --c0: #52514e; --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
      --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
      --i0: #ffffff; --i1: #0b0b0b; --i2: #0b0b0b; --i3: #0b0b0b; --i4: #0b0b0b;
      --i5: #0b0b0b; --i6: #ffffff; --i7: #0b0b0b; --i8: #0b0b0b;
    }
  }
  {% for i in range(9) %}.fill-s{{ i }} { fill: var(--c{{ i }}); } .bg-s{{ i }} { background: var(--c{{ i }}); } .ink-s{{ i }} { fill: var(--i{{ i }}); color: var(--i{{ i }}); }
  .tint-s{{ i }} { background: color-mix(in srgb, var(--c{{ i }}) 16%, var(--surface)); border-top: 4px solid var(--c{{ i }}); }
  {% endfor %}

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  a { color: inherit; text-underline-offset: 2px; }
  a:focus-visible, input:focus-visible, button:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--ink); outline-offset: 2px;
  }

  /* --- header ------------------------------------------------------------ */
  .top { position: sticky; top: 0; z-index: 2; background: var(--page); border-bottom: 1px solid var(--grid); }
  .top-inner { max-width: 1120px; margin: 0 auto; padding: 10px 16px;
    display: flex; gap: 10px 18px; align-items: center; flex-wrap: wrap; }
  .brand { font-weight: 650; text-decoration: none; letter-spacing: -0.01em; white-space: nowrap; }
  .nav { display: flex; gap: 4px; flex-wrap: wrap; }
  .nav a { text-decoration: none; padding: 4px 10px; border-radius: 999px; color: var(--ink-2); font-size: 0.92rem; }
  .nav a:hover { background: var(--grid); color: var(--ink); }
  .nav a[aria-current="page"] { background: var(--ink); color: var(--page); }
  .top form { flex: 1 1 220px; }
  input[type="search"] { width: 100%; font: inherit; padding: 7px 12px; border-radius: 8px;
    border: 1px solid var(--grid); background: var(--raised); color: var(--ink); }

  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 6px; letter-spacing: -0.015em; }
  .lede { color: var(--ink-2); margin: 0 0 22px; }
  h2.section { font-size: 0.78rem; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--muted); margin: 36px 0 12px; font-weight: 600; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .section-head a { font-size: 0.88rem; color: var(--ink-2); }
  .count { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  .empty { color: var(--ink-2); background: var(--surface); border: 1px dashed var(--axis);
    border-radius: 10px; padding: 16px; }
  code { font: 0.9em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* --- chips & swatches ---------------------------------------------------- */
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 10px 1px 8px;
    border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--ring);
    color: var(--ink); font-size: 0.8rem; text-decoration: none; white-space: nowrap; }
  a.chip:hover { box-shadow: inset 0 0 0 1px var(--ink-2); }
  .chip[aria-current="true"] { background: var(--ink); color: var(--page); box-shadow: none; }
  .swatch { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--muted); font-size: 0.82rem; }
  .src { display: inline-flex; align-items: center; gap: 4px; }
  .src svg { width: 14px; height: 14px; }

  /* --- card grid ----------------------------------------------------------- */
  .grid { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
  .gcard { display: flex; flex-direction: column; background: var(--surface); border-radius: 12px;
    box-shadow: 0 0 0 1px var(--ring); overflow: hidden; }
  .gcard:hover { box-shadow: 0 0 0 1px var(--ink-2); }
  .thumb { display: block; aspect-ratio: 16 / 9; max-width: 100%; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; background: var(--grid); }
  .band { width: 100%; height: 100%; display: grid; place-items: center; color: var(--ink-2); }
  .band svg { width: 34px; height: 34px; opacity: 0.7; }
  .gbody { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .gbody h3 { margin: 0; font-size: 1rem; line-height: 1.35; }
  .gbody h3 a { text-decoration: none; }
  .gbody h3 a::after { content: ""; position: absolute; inset: 0; }  /* whole card clickable */
  .gcard { position: relative; }
  .gbody .chip, .gbody .meta a { position: relative; z-index: 1; }
  .clamp { margin: 0; color: var(--ink-2); font-size: 0.9rem; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .gbody .meta { margin-top: auto; padding-top: 4px; }

  /* --- charts -------------------------------------------------------------- */
  .panel { background: var(--surface); border-radius: 12px; box-shadow: 0 0 0 1px var(--ring); padding: 16px; }
  .chart-scroll { overflow-x: auto; }
  .chart-scroll > svg { display: block; width: 100%; height: auto; }
  .chart-min { min-width: 640px; }
  svg text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .axis-text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .baseline { stroke: var(--axis); stroke-width: 1; }
  .seg { transition: opacity 120ms; }
  a:hover > .seg, a:focus-visible > .seg { opacity: 0.8; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 12px; padding: 0; list-style: none;
    font-size: 0.85rem; color: var(--ink-2); }
  .legend li { display: inline-flex; align-items: center; gap: 6px; }
  details.table-view { margin-top: 12px; font-size: 0.88rem; }
  details.table-view summary { cursor: pointer; color: var(--ink-2); }
  .table-scroll { overflow-x: auto; margin-top: 8px; }
  .table-scroll table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .table-scroll th, .table-scroll td { padding: 4px 10px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
  .table-scroll th:first-child, .table-scroll td:first-child { text-align: left; }

  /* treemap: shown from tablet width; phones get the stacked list instead */
  .treemap-wrap { display: none; }
  .tile-label { font-size: 13px; font-weight: 600; }
  .tile-count { font-size: 12px; opacity: 0.85; font-variant-numeric: tabular-nums; }
  .topic-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .topic-row a { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; text-decoration: none;
    padding: 10px 12px; background: var(--surface); border-radius: 10px; box-shadow: 0 0 0 1px var(--ring); }
  .topic-row .name { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
  .topic-row .desc { grid-column: 1 / -1; color: var(--ink-2); font-size: 0.88rem; }
  .meter { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
  .meter > span { display: block; height: 100%; border-radius: 3px; }
  @media (min-width: 720px) {
    .treemap-wrap { display: block; }
    .topic-list.has-treemap { display: none; }
  }
  .together { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .together li { font-size: 0.85rem; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  .two-col { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  .two-col > * { min-width: 0; }
  @media (min-width: 900px) { .two-col { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); } }

  /* --- facets, note, source ---------------------------------------------- */
  .facets { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; align-items: center; }
  .facets-label { color: var(--muted); font-size: 0.8rem; margin-right: 2px; min-width: 52px; }
  .note-hero { display: grid; gap: 20px; grid-template-columns: 1fr; align-items: start; }
  @media (min-width: 820px) { .note-hero.has-thumb { grid-template-columns: 1fr 320px; } }
  .note-hero img { width: 100%; max-width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; }
  .note-body { max-width: 760px; }
  .note-body h2 { font-size: 1.05rem; margin: 28px 0 8px; }
  .note-body ul { padding-left: 1.2em; margin: 0; }
  .note-body li { margin: 0 0 6px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 28px 0 0; }
  .source-link { overflow-wrap: anywhere; }
  pre.source { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; background: var(--surface);
    box-shadow: 0 0 0 1px var(--ring); border-radius: 10px; padding: 16px;
    font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .notice { font-size: 0.85rem; color: var(--ink-2); margin: 0 0 12px; }
  .btn { font: inherit; font-size: 0.9rem; border-radius: 999px; padding: 6px 14px; cursor: pointer;
    border: 1px solid var(--grid); background: var(--surface); color: var(--ink); }
  .btn:hover { border-color: var(--ink-2); }
  .btn-primary { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 0; }
  .toolbar form { margin: 0; }
  .btn[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .reads { color: var(--muted); font-size: 0.82rem; }
  .banner { background: var(--surface); box-shadow: inset 0 0 0 1px var(--axis); border-radius: 10px;
    padding: 10px 14px; margin: 0 0 16px; color: var(--ink-2); font-size: 0.9rem; }
  .star { color: var(--c4); margin-right: 4px; }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="/">Second Brain</a>
    <nav class="nav" aria-label="Sections">
      {% for href, label in nav_items %}
      <a href="{{ href }}"{% if active == href %} aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
    <form action="/search" method="get" role="search">
      <input type="search" name="q" value="{{ q }}" placeholder="Search your notes" aria-label="Search your notes">
    </form>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
