<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Second Brain{% endblock %}</title>
<style>
  :root {
    --bg: #faf9f6; --surface: #ffffff; --fg: #1f1e1b; --muted: #6a675f;
    --line: #e5e2da; --chip: #f0ece3; --accent: #8a520f; --accent-fg: #ffffff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151513; --surface: #1d1c1a; --fg: #ebe9e3; --muted: #a29f97;
      --line: #2e2d29; --chip: #292824; --accent: #e2aa5c; --accent-fg: #151513;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  a { color: inherit; text-underline-offset: 2px; }
  a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .top {
    position: sticky; top: 0; z-index: 1; background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .top-inner {
    max-width: 880px; margin: 0 auto; padding: 10px 16px;
    display: flex; gap: 12px 16px; align-items: center; flex-wrap: wrap;
  }
  .brand { font-weight: 650; text-decoration: none; letter-spacing: -0.01em; white-space: nowrap; }
  .top form { flex: 1 1 220px; }
  input[type="search"] {
    width: 100%; font: inherit; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  }

  main { max-width: 880px; margin: 0 auto; padding: 24px 16px 56px; }
  h1 { font-size: 1.55rem; line-height: 1.25; margin: 0 0 6px; letter-spacing: -0.015em; }
  .lede { color: var(--muted); margin: 0 0 22px; }
  h2.section { font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); margin: 32px 0 10px; font-weight: 600; }

  .tiles { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
  .tile a { display: block; height: 100%; padding: 14px 16px; text-decoration: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .tile a:hover { border-color: var(--accent); }
  .tile-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .tile-name { font-weight: 600; }
  .tile p { margin: 6px 0 0; color: var(--muted); font-size: 0.9rem; }
  .count { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }

  .cards { list-style: none; margin: 0; padding: 0; }
  .card { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .card:first-child { padding-top: 4px; }
  .card h3 { font-size: 1.05rem; line-height: 1.35; margin: 0 0 4px; }
  .card h3 a { text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .card p { margin: 0 0 8px; }

  .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center;
    color: var(--muted); font-size: 0.85rem; }
  .chip { display: inline-block; padding: 1px 10px; border-radius: 999px;
    background: var(--chip); color: var(--fg); font-size: 0.8rem; text-decoration: none; }
  a.chip:hover { text-decoration: underline; }

  .facets { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; align-items: center; }
  .facets-label { color: var(--muted); font-size: 0.8rem; margin-right: 2px; min-width: 52px; }
  .facets .chip[aria-current="true"] { background: var(--accent); color: var(--accent-fg); }
  .facet-block { margin-bottom: 18px; }

  .note-body h2 { font-size: 1.05rem; margin: 26px 0 8px; }
  .note-body ul { padding-left: 1.2em; margin: 0; }
  .note-body li { margin: 0 0 6px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 28px 0 0; }
  .source-link { overflow-wrap: anywhere; }

  pre.source { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .notice { font-size: 0.85rem; color: var(--muted); margin: 0 0 12px; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="/">Second Brain</a>
    <form action="/search" method="get" role="search">
      <input type="search" name="q" value="{{ q }}" placeholder="Search your notes" aria-label="Search your notes">
    </form>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
